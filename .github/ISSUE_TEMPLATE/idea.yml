name: I have an idea
description: Something Cocoon should do, or do better.
title: "Idea: "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Cocoon to do? Why would it help you?
      placeholder: I'd love to share a preview link of my app with a friend before publishing it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cocoon version
      placeholder: "0.1.0"
